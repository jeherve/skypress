name: CI

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # The build catches failures the tests can't: a non-underscored test file
      # under src/pages/ breaks prerendering, and a bad dedupe breaks bundling.
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    # Forks and self-hosted copies skip this until they set their own
    # CLOUDFLARE_ACCOUNT_ID variable and CLOUDFLARE_API_TOKEN secret.
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PUBLIC_SITE_URL || 'https://skypress.blog' }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://skypress.blog' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Only this step sees the token: dependency install scripts and build
      # plugins run in the steps above without it.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
